[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "advanced-trading-advisor"
version = "0.1.0"
description = "Local spot portfolio advisor core"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]
[project.scripts]
advisor = "advanced_trading_advisor.cli.main:main"
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres_integration: requires an isolated ADVISOR_TEST_POSTGRES_URL database",
]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
