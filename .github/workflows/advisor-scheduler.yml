name: Advisor scheduler

# UTC slots: 00:10, 04:10, 08:10, 12:10, 16:10, 20:10.
on:
  workflow_dispatch:
  schedule:
    - cron: "10 */4 * * *"

permissions:
  contents: read

concurrency:
  group: advisor-production-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install .

      - name: Dispatch at most one eligible slot
        env:
          ADVISOR_STORAGE_BACKEND: postgres
          ADVISOR_DATABASE_URL: ${{ secrets.ADVISOR_DATABASE_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_TIER: demo
          MARKET_DATA_TIMEOUT_SECONDS: "10"
          OPENAI_ENABLED: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          OPENAI_REASONING_EFFORT: low
          OPENAI_TIMEOUT_SECONDS: "45"
          TELEGRAM_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TIMEOUT_SECONDS: "10"
          TELEGRAM_DISABLE_NOTIFICATION: "false"
          SCHEDULER_ENABLED: "true"
          SCHEDULER_INTERVAL_HOURS: "4"
          SCHEDULER_CANDLE_DELAY_MINUTES: "10"
          SCHEDULER_MAX_STARTUP_CATCHUP_AGE_MINUTES: "30"
          PYTHONUNBUFFERED: "1"
        run: .venv/bin/advisor scheduler dispatch
