name: Binance snapshot validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: binance-snapshot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install component dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-development-py313.lock

      - name: Run offline component tests
        run: python -m pytest -q tests

      - name: Run component Ruff lint
        run: ruff check .

      - name: Check component Ruff formatting
        run: ruff format --check .

  deliver:
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: binance-snapshot-telegram-delivery
      cancel-in-progress: false
    defaults:
      run:
        working-directory: binance-snapshot
    env:
      BINANCE_API_BASE_URL: https://data-api.binance.vision

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-production-py313.lock

      - name: Deliver eligible hourly snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BINANCE_SNAPSHOT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BINANCE_SNAPSHOT_TELEGRAM_CHAT_ID }}
        run: python hourly_snapshot.py
