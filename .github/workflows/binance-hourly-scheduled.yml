name: Binance hourly scheduled delivery

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"  # HH:05 UTC

permissions:
  contents: read

jobs:
  deliver:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: binance-snapshot-telegram-delivery
      cancel-in-progress: false
    defaults:
      run:
        working-directory: binance-snapshot
    env:
      BINANCE_API_BASE_URL: https://data-api.binance.vision

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-production-py313.lock
          .venv/bin/python -m pip check

      - name: Deliver eligible hourly snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BINANCE_SNAPSHOT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BINANCE_SNAPSHOT_TELEGRAM_CHAT_ID }}
        run: .venv/bin/python hourly_snapshot.py
