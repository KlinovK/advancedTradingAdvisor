name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/root-development-py313.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation .
          .venv/bin/python -m pip check

      - name: Run offline test suite
        run: .venv/bin/python -m pytest

      - name: Run Ruff lint
        run: .venv/bin/ruff check .

      - name: Check Ruff formatting
        run: .venv/bin/ruff format --check .

  snapshot-offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: binance-snapshot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create Snapshot development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-development-py313.lock
          .venv/bin/python -m pip check

      - name: Run offline Snapshot tests
        run: .venv/bin/python -m pytest -q tests

      - name: Run Snapshot Ruff lint
        run: .venv/bin/ruff check .

      - name: Check Snapshot Ruff formatting
        run: .venv/bin/ruff format --check .

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: advisor_test
          POSTGRES_USER: advisor_test
          POSTGRES_PASSWORD: advisor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisor_test -d advisor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements/root-development-py313.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation .
          .venv/bin/python -m pip check

      - name: Run PostgreSQL integration contracts
        env:
          ADVISOR_TEST_POSTGRES_URL: postgresql://advisor_test:advisor_test@127.0.0.1:5432/advisor_test
        run: >-
          .venv/bin/python -m pytest
          -m postgres_integration
          tests
